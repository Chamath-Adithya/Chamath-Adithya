name: "✍️ Sign the Guestbook"
description: "Leave your mark on my profile!"
title: "Guestbook: [Your Name/Message]"
labels: ["guestbook"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thanks for signing my guestbook! 🚀
        Your avatar and username will be added to my profile README automatically.
  - type: input
    id: message
    attributes:
      label: "Leave a short message (optional)"
      placeholder: "e.g. Nice profile! / Hello from Sri Lanka!"
    validations:
      required: false
